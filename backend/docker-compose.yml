version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: flowerconnect_postgres
    restart: always
    environment:
      POSTGRES_USER: flowerconnect
      POSTGRES_PASSWORD: flowerconnect_password
      POSTGRES_DB: flowerconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowerconnect -d flowerconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: flowerconnect_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://flowerconnect:flowerconnect_password@db:5432/flowerconnect_db
      - SECRET_KEY=flowerconnect-super-secure-production-secret-key-32chars
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

